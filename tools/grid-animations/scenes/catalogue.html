<!doctype html>
<meta charset="utf-8" />
<title>Espacio Catalogue</title>
<style>
  html,
  body {
    margin: 0;
    background: #0d0d0d;
    overflow: hidden;
  }
</style>
<script type="importmap">
  { "imports": { "three": "../node_modules/three/build/three.module.js" } }
</script>
<script type="module">
  // 11 · ESPACIO CATALOGUE. The open catalogue turns a page every 2.5 s (three turns per loop: spread 0 -> 1 -> 2
  // -> 0, so the last turn lands on the starting spread). The Inmueble cover floats above it, drifting and tilting
  // on whole-loop sine harmonics that are all zero at frame 0, where it sits exactly on the original's cover.
  //
  // Space: world units are the original artwork's pixels (y flipped), with the camera straight above the image
  // centre, so the flat book at z = 0 lands on the original's page corners. Perspective only shows when the
  // turning page lifts or the cover tilts.
  //
  // Pages are drawn by a print shader in page space: three tones sampled from the original (white paper, brown
  // ink, near-black ink) with short streaks running along the spine, like the original's paper texture.
  import * as THREE from 'three';
  import { FPS, ORIG_H, ORIG_W, SCALE, defineScene, fillBackground, loadImage, loadJSON, makeCanvas, resetTransform } from './common.js';

  const LOOP = 7.5; // seconds
  const FRAMES = LOOP * FPS;
  const TURN_EVERY = FRAMES / 3; // 75 frames
  const TURN_FRAMES = 40; // each turn takes 1.33 s, after a 35-frame hold
  const SEQUENCE = [0, 1, 2]; // spreads, wrapping

  // Book, measured from the original (original px): spine top/bottom and the page-width vector.
  const SPINE_TOP = [867, 823];
  const SPINE = [586, 764]; // spine top -> spine bottom
  const ACROSS = [603.5, -419]; // spine -> right page's outer edge (mean of the visible top edges)
  const PAPER = [1, 1, 1];
  const INK = [0x8b / 255, 0x6a / 255, 0x2a / 255];
  const DEEP = [0x0d / 255, 0x0d / 255, 0x0d / 255];
  const PAPER_LEVEL = [0.86, 0.83, 0.74]; // each spread's paper grey in the source photo, normalised to white

  const CAMERA_Z = 4400; // vertical fov ~30°
  const COVER_Z = 60;

  const W = v => new THREE.Vector3(v[0], -v[1], 0); // original px -> world
  const P0 = W(SPINE_TOP);
  const V = W(SPINE);
  const U = W(ACROSS);
  const UZ = new THREE.Vector3(0, 0, 1);

  let renderer, scene, camera, spreads, staticLeft, staticRight, turning, cover, coverRest, out;

  function pageMaterial() {
    return new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      uniforms: {
        front: { value: null },
        back: { value: null },
        frontRight: { value: 1 },
        backRight: { value: 0 },
        frontPaper: { value: 0.86 },
        backPaper: { value: 0.86 },
        paper: { value: new THREE.Vector3(...PAPER) },
        ink: { value: new THREE.Vector3(...INK) },
        deep: { value: new THREE.Vector3(...DEEP) },
      },
      vertexShader: `
        attribute float shade;
        varying vec2 vUv; varying float vShade;
        void main() { vUv = uv; vShade = shade; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D front; uniform sampler2D back;
        uniform float frontRight; uniform float backRight; uniform float frontPaper; uniform float backPaper;
        uniform vec3 paper; uniform vec3 ink; uniform vec3 deep;
        varying vec2 vUv; varying float vShade;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        void main() {
          // vUv.x: 0 at the spine, 1 at the outer edge; vUv.y: 0 top, 1 bottom.
          bool isFront = !gl_FrontFacing; // the page's winding faces away from the camera when it lies flat
          float right = isFront ? frontRight : backRight;
          float u = right > 0.5 ? 0.5 + 0.5 * vUv.x : 0.5 - 0.5 * vUv.x;
          // The source spreads are low resolution (430 px a page), so ink is thickened with a small minimum filter
          // to the weight of the original's print.
          vec2 texel = vec2(1.0 / 861.0, 1.0 / 600.0);
          float lum = 1.0;
          for (int dx = -1; dx <= 1; dx++) {
            for (int dy = -1; dy <= 1; dy++) {
              vec2 q = vec2(u, vUv.y) + vec2(float(dx), float(dy)) * texel * 1.4;
              vec3 c = isFront ? texture2D(front, q).rgb : texture2D(back, q).rgb;
              lum = min(lum, dot(c, vec3(0.299, 0.587, 0.114)));
            }
          }
          float level = isFront ? frontPaper : backPaper;
          float a = 1.0 - clamp((lum / level) * vShade, 0.0, 1.0); // ink amount
          a = clamp((a - 0.06) * 1.35, 0.0, 1.0); // paper grain in the photo stays white; ink gets its weight
          // Streak cells: ~1.5 px across, ~8 px along the spine, in the original's page pixels (735 x 963).
          vec2 cell = floor(vec2(vUv.x * 490.0, vUv.y * 120.0));
          float n = hash(cell + (isFront ? 0.0 : 17.0)) - 0.5;
          float m = hash(cell * 1.7 + 3.1);
          vec3 col = paper;
          if (a + n * 0.3 > 0.85) col = deep;
          else if (a + n * 0.45 > 0.22 || m > 0.93) col = ink;
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
  }

  // A page as a strip of columns from the spine outwards. `angleAt(s)` gives each column's direction around the
  // spine (0 = lying right, PI = lying left); the page is integrated column by column, so it bends smoothly.
  function pageGeometry(cols = 48, rows = 12) {
    const geo = new THREE.BufferGeometry();
    const n = (cols + 1) * (rows + 1);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
    geo.setAttribute('shade', new THREE.Float32BufferAttribute(new Float32Array(n).fill(1), 1));
    const uv = [];
    const idx = [];
    for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) uv.push(i / cols, j / rows);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const a = j * (cols + 1) + i;
        idx.push(a, a + 1, a + cols + 1, a + 1, a + cols + 2, a + cols + 1);
      }
    }
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.userData = { cols, rows };
    return geo;
  }

  function shapePage(geo, angleAt, lift = 0) {
    const { cols, rows } = geo.userData;
    const pos = geo.attributes.position;
    const shade = geo.attributes.shade;
    const width = U.length();
    const uHat = U.clone().normalize();
    const col = new THREE.Vector3(); // offset of column i from the spine
    const light = new THREE.Vector3(-0.3, 0.4, 1).normalize();
    for (let i = 0; i <= cols; i++) {
      const s = i / cols;
      const phi = angleAt(s);
      if (i > 0) {
        const phiMid = angleAt(s - 0.5 / cols);
        col.addScaledVector(uHat, (Math.cos(phiMid) * width) / cols).addScaledVector(UZ, (Math.sin(phiMid) * width) / cols);
      }
      // Surface normal of this column (perpendicular to its direction, facing up when the page lies right).
      const normal = uHat.clone().multiplyScalar(-Math.sin(phi)).addScaledVector(UZ, Math.cos(phi));
      const lit = 0.72 + 0.28 * Math.abs(normal.dot(light));
      for (let j = 0; j <= rows; j++) {
        const k = j * (cols + 1) + i;
        const p = P0.clone().addScaledVector(V, j / rows).add(col);
        pos.setXYZ(k, p.x, p.y, p.z + lift);
        shade.setX(k, lit);
      }
    }
    pos.needsUpdate = true;
    shade.needsUpdate = true;
    geo.computeBoundingSphere();
  }

  function setFace(mat, which, spreadIndex, right) {
    mat.uniforms[which].value = spreads[spreadIndex];
    mat.uniforms[`${which}Right`].value = right ? 1 : 0;
    mat.uniforms[`${which}Paper`].value = PAPER_LEVEL[spreadIndex];
  }

  const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);

  defineScene({
    frames: FRAMES,
    async setup() {
      const [coverImg, coverInfo, ...spreadImgs] = await Promise.all([
        loadImage('../assets/catalogue-cover.png'),
        loadJSON('../assets/catalogue-cover.json'),
        ...[0, 1, 2].map(i => loadImage(`../assets/catalogue-spread-${i}.png`)),
      ]);
      const tex = img => {
        const t = new THREE.Texture(img);
        t.flipY = false;
        t.colorSpace = THREE.NoColorSpace;
        t.anisotropy = 8;
        t.needsUpdate = true;
        return t;
      };
      spreads = spreadImgs.map(tex);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(ORIG_W, ORIG_H, false);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
      camera = new THREE.PerspectiveCamera((2 * Math.atan(ORIG_H / 2 / CAMERA_Z) * 180) / Math.PI, ORIG_W / ORIG_H, 10, 10000);
      camera.position.set(ORIG_W / 2, -ORIG_H / 2, CAMERA_Z);
      camera.lookAt(ORIG_W / 2, -ORIG_H / 2, 0);
      scene = new THREE.Scene();

      // Static left and right pages (flat), and the turning page.
      staticLeft = new THREE.Mesh(pageGeometry(1, 1), pageMaterial());
      staticRight = new THREE.Mesh(pageGeometry(1, 1), pageMaterial());
      shapePage(staticLeft.geometry, () => Math.PI);
      shapePage(staticRight.geometry, () => 0);
      turning = new THREE.Mesh(pageGeometry(), pageMaterial());
      scene.add(staticLeft, staticRight, turning);

      // The cover: a plane through its four measured corners, lifted to COVER_Z and shrunk so it projects onto the
      // same pixels at rest.
      const corners = coverInfo.corners.map(c => W(c));
      const centre = corners.reduce((a, c) => a.add(c), new THREE.Vector3()).multiplyScalar(0.25);
      const shrink = (CAMERA_Z - COVER_Z) / CAMERA_Z;
      const camXY = new THREE.Vector3(ORIG_W / 2, -ORIG_H / 2, 0);
      const restCentre = camXY.clone().add(centre.clone().sub(camXY).multiplyScalar(shrink));
      const geo = new THREE.BufferGeometry();
      const local = corners.map(c => c.clone().sub(centre).multiplyScalar(shrink));
      geo.setAttribute('position', new THREE.Float32BufferAttribute(local.flatMap(v => [v.x, v.y, 0]), 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
      geo.setIndex([0, 3, 1, 1, 3, 2]);
      // The cover floats: always drawn over the book, even over a page lifted higher than it.
      cover = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({ map: tex(coverImg), side: THREE.DoubleSide, toneMapped: false, depthTest: false })
      );
      cover.renderOrder = 1;
      coverRest = restCentre.setZ(COVER_Z);
      scene.add(cover);

      out = makeCanvas({ attach: true });
    },
    async render(frame) {
      // Which turn, and how far through it.
      const k = Math.floor(frame / TURN_EVERY);
      const local = frame - k * TURN_EVERY;
      const start = TURN_EVERY - TURN_FRAMES;
      const cur = SEQUENCE[k];
      const next = SEQUENCE[(k + 1) % SEQUENCE.length];
      const p = local < start ? 0 : (local - start) / TURN_FRAMES; // 0..0.975; the next frame is the landed state

      setFace(staticLeft.material, 'front', cur, false);
      setFace(staticLeft.material, 'back', cur, false);
      setFace(staticRight.material, 'front', p > 0 ? next : cur, true);
      setFace(staticRight.material, 'back', p > 0 ? next : cur, true);
      turning.visible = p > 0;
      if (p > 0) {
        setFace(turning.material, 'front', cur, true);
        setFace(turning.material, 'back', next, false);
        const theta = Math.PI * ease(p);
        // The free edge lags behind the spine side mid-turn (a curl), and the lag vanishes at both ends.
        shapePage(turning.geometry, s => theta - 0.7 * s * s * Math.sin(theta), 0.6);
      }

      // Cover: drift and tilt on whole-loop harmonics, all zero at frame 0.
      const w = (2 * Math.PI * frame) / FRAMES;
      cover.position.set(coverRest.x + 14 * Math.sin(w), coverRest.y + 9 * Math.sin(2 * w), coverRest.z);
      cover.rotation.set((4 * Math.PI) / 180 * Math.sin(w), (3 * Math.PI) / 180 * Math.sin(2 * w), (1.2 * Math.PI) / 180 * Math.sin(w));

      renderer.render(scene, camera);
      const ctx = out.ctx;
      fillBackground(ctx);
      resetTransform(ctx, false);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(renderer.domElement, 0, 0, out.canvas.width, out.canvas.height);
    },
  });
</script>
